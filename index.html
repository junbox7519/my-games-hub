<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Games Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1>My Games Hub</h1>
  <p class="tagline">自作の簡易ゲーム・アプリ紹介ページ</p>
</header>

<main>
  <section class="intro">
    <p>HTML / CSS / JavaScript で作った簡易ゲームやアプリをここにまとめていきます。</p>
  </section>

  <section class="game-grid">
    <a class="game-card" href="games/druaga/">
      <div class="thumb">🗡️</div>
      <h2>THE TOWER ～迷宮の塔～</h2>
      <p>迷宮を登り、鍵を集めてドラゴンに挑む見下ろし型アクション</p>
    </a>
    <a class="game-card" href="games/skyline-scramble/">
      <div class="thumb">🏙️</div>
      <h2>SKYLINE SCRAMBLE</h2>
      <p>クレイジークライマー風のビル登りアクション。爆弾・水・鳥・火事をかわして屋上を目指せ</p>
    </a>
    <a class="game-card" href="games/neon-cascade/">
      <div class="thumb">🧱</div>
      <h2>NEON CASCADE</h2>
      <p>テトリス風の落ちものパズル。ブロックを回転・移動させてラインを消していこう</p>
    </a>
  </section>
</main>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> My Games Hub</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
